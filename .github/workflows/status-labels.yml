name: Status labels

# Keeps status labels in sync with what is happening, so the board is always
# correct without anyone updating it by hand.
#
# Task issues:
#   @cursor comment on the issue or its PR   -> status: agent-working
#   PR opened / new commits pushed           -> status: in-review
#   PR merged                                -> status labels removed
#   (status: needs-fix and status: ready-to-merge are set by the reviewer)
#
# QA bug issues:
#   QA files the bug                         -> bug: new          (qa-report.js)
#   @cursor comment that mentions the bug    -> bug: fixing
#   a pushed commit mentions "(#bug)"        -> bug: fixed
#   QA re-check passes / fails               -> bug: verified + closed / bug: new (qa-report.js)
#   reviewer decides it is intended          -> bug: not-a-bug + closed (conductor)

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: status-labels-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const STATUS = [
              "status: queued",
              "status: agent-working",
              "status: in-review",
              "status: needs-fix",
              "status: ready-to-merge",
            ];
            const BUG_STATUS = ["bug: new", "bug: fixing", "bug: fixed", "bug: verified", "bug: not-a-bug"];
            const { owner, repo } = context.repo;
            const names = (issue) => issue.labels.map((l) => (typeof l === "string" ? l : l.name));

            const linkedIssues = (body) => {
              const out = new Set();
              const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              for (const m of (body || "").matchAll(re)) out.add(Number(m[1]));
              return [...out];
            };
            const mentioned = (text) => {
              const out = new Set();
              for (const m of (text || "").matchAll(/#(\d+)\b/g)) out.add(Number(m[1]));
              return [...out];
            };

            const swap = async (issueNumber, group, next) => {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              if (issue.pull_request) return null;
              const have = names(issue);
              for (const name of have) {
                if (group.includes(name) && name !== next) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name }).catch(() => {});
                }
              }
              if (next && !have.includes(next)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [next] });
              }
              core.info(`#${issueNumber} -> ${next ?? "cleared"}`);
              return issue;
            };

            // Task status (only issues labeled "task").
            const setTaskStatus = async (n, next) => {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
              if (issue.pull_request || !names(issue).includes("task")) return;
              await swap(n, STATUS, next);
            };

            // Bug status (only open issues labeled "qa"), never moving a bug backwards
            // from "fixed" to "fixing" by accident.
            const setBugStatus = async (n, next, { onlyFrom } = {}) => {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
              if (issue.pull_request || issue.state !== "open") return;
              const have = names(issue);
              if (!have.includes("qa")) return;
              if (onlyFrom && !have.some((l) => onlyFrom.includes(l)) && have.some((l) => BUG_STATUS.includes(l))) return;
              await swap(n, BUG_STATUS, next);
            };

            if (context.eventName === "issue_comment") {
              const body = (context.payload.comment.body || "").trim();
              if (!body.toLowerCase().startsWith("@cursor")) return;
              const item = context.payload.issue;
              if (item.pull_request) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: item.number });
                for (const n of linkedIssues(pr.body)) await setTaskStatus(n, "status: agent-working");
              } else {
                await setTaskStatus(item.number, "status: agent-working");
                await setBugStatus(item.number, "bug: fixing");
              }
              for (const n of mentioned(body)) await setBugStatus(n, "bug: fixing");
              return;
            }

            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const issues = linkedIssues(pr.body);

            if (action === "closed") {
              if (pr.merged) for (const n of issues) await setTaskStatus(n, null);
              return;
            }
            for (const n of issues) await setTaskStatus(n, "status: in-review");

            // A newly pushed fix commit that names a bug, like "fix(demo): ... (#11)", marks it fixed.
            // Only commits from this push count, so an old fix does not re-mark a bug QA sent back.
            if (action === "synchronize" || action === "opened") {
              let commits = [];
              if (action === "synchronize" && context.payload.before) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${context.payload.before}...${context.payload.after}`,
                }).catch(() => ({ data: { commits: [] } }));
                commits = data.commits || [];
              } else {
                commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
              }
              const fixedRefs = new Set();
              for (const c of commits) {
                const msg = c.commit.message || "";
                if (!/^fix(\(|:)/i.test(msg)) continue;
                for (const m of msg.matchAll(/\(#(\d+)\)/g)) fixedRefs.add(Number(m[1]));
              }
              for (const n of fixedRefs) {
                if (issues.includes(n)) continue;
                await setBugStatus(n, "bug: fixed", { onlyFrom: ["bug: new", "bug: fixing"] });
              }
            }

name: Status labels

# Keeps the `status: ...` label on task issues in sync with what is happening,
# so the board is always correct without anyone updating it by hand.
#
#   @cursor comment on the issue or its PR   -> status: agent-working
#   PR opened / new commits pushed           -> status: in-review
#   PR merged                                -> status labels removed
#
# `status: needs-fix` and `status: ready-to-merge` are set by the reviewer.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: status-labels-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const STATUS = [
              "status: queued",
              "status: agent-working",
              "status: in-review",
              "status: needs-fix",
              "status: ready-to-merge",
            ];
            const { owner, repo } = context.repo;

            const linkedIssues = (body) => {
              const out = new Set();
              const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              let m;
              while ((m = re.exec(body || "")) !== null) out.add(Number(m[1]));
              return [...out];
            };

            const setStatus = async (issueNumber, next) => {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              if (issue.pull_request) return;
              const names = issue.labels.map((l) => (typeof l === "string" ? l : l.name));
              if (!names.includes("task")) return;
              for (const name of names) {
                if (STATUS.includes(name) && name !== next) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name }).catch(() => {});
                }
              }
              if (next && !names.includes(next)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [next] });
              }
              core.info(`#${issueNumber} -> ${next ?? "no status"}`);
            };

            if (context.eventName === "issue_comment") {
              const body = (context.payload.comment.body || "").trim();
              if (!body.toLowerCase().startsWith("@cursor")) return;
              const item = context.payload.issue;
              if (item.pull_request) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: item.number });
                for (const n of linkedIssues(pr.body)) await setStatus(n, "status: agent-working");
              } else {
                await setStatus(item.number, "status: agent-working");
              }
              return;
            }

            const pr = context.payload.pull_request;
            const issues = linkedIssues(pr.body);
            if (!issues.length) return;
            const action = context.payload.action;
            if (action === "closed") {
              if (pr.merged) for (const n of issues) await setStatus(n, null);
              return;
            }
            for (const n of issues) await setStatus(n, "status: in-review");

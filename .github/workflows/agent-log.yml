name: Agent log

# Records every action in the agent workflow as one JSON file per event on the
# `agentflow-log` branch: comments (conductor, coder, owner), labels, issues,
# PR pushes with their commits, reviews, CI and QA runs, preview deploys.
# The weekly retro and the process template are built from this log.

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI, QA]
    types: [completed]
  deployment_status:

permissions:
  contents: write
  pull-requests: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: /.agentflow/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const log = require(`${process.env.GITHUB_WORKSPACE}/.agentflow/scripts/log-event.js`);
            core.info(await log({ github, context }));
